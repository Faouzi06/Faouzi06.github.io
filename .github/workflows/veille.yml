# Met à jour automatiquement la veille technologique (assets/data/veille.json)
# toutes les 6 heures, et à la demande depuis l'onglet « Actions » de GitHub.
name: Mise à jour de la veille

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Agréger les flux RSS
        shell: pwsh
        run: ./tools/maj-veille.ps1

      - name: Publier si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/veille.json
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Veille : mise à jour automatique"
            git push
          fi
